function choose(n,k){let out=1;for(let i=1;i<=k;i++)out=out*(n-i+1)/i;return out;}
function fac(n){let a=1;for(let i=2;i<=n;i++)a*=i;return a;}
function ihcdf(x,n){if(x<=0)return 0;if(x>=n)return 1;let z=0;for(let k=0;k<=Math.floor(x);k++)z+=(k%2?-1:1)*choose(n,k)*Math.pow(x-k,n);return clamp(z/fac(n),0,1);}

   for(let hit=0;hit<r.hits;hit++){
    if(rand()>r.accuracy)continue;

    if(r.type==='physical'){
      const B=.8+.2*rand();const primaryRoll=r.extra.primary*(r.extra.M+(1-r.extra.M)*rand());const base=r.power*r.watk*(B+(primaryRoll*r.extra.W+r.extra.secondary)/100+r.ap/50);val=Math.max(0,base*r.mod);

function renderScanner(){const fields=[['level','scanLevel'],['str','STR'],['dex','DEX'],['int','INT'],['luk','LUK'],['weaponAttack','scanWeaponAttack'],['weaponMagic','scanWeaponMagic'],['gloveAttack','scanGloveAttack'],['gloveMagic','scanGloveMagic'],['secondaryReq','scanGearReq']];const complete=Object.values(scanFiles).every(Boolean);return `<div class="headline"><div><h1>📷 ${t('scanTitle')}</h1><p>${t('scanSub')}</p></div><button class="button" data-tab="sim">${t('scanBack')} →</button></div><div class="card"><div class="field" style="margin-bottom:12px"><label>${t('scanChooseJob')}</label><select data-scan-job="1" id="scanJob">${Object.entries(JOBS).map(([k,j])=>`<option value="${k}" ${prof().job===k?'selected':''}>${safe(j.name)}</option>`).join('')}</select></div><div class="callout warning">⚠ ${t('scanWhy')}</div><div class="scan-guide">${scanStep('stat','scanStep1','scanStatGuide')}${scanStep('weapon','scanStep2','scanWeaponGuide')}${scanStep('gloves','scanStep3','scanGloveGuide')}</div><div class="scan-tools"><button class="button primary" data-action="readScreens" ${complete?'':'disabled'}>${t('scanRun')}</button><button class="button sm" data-action="clearScreens">${t('scanClear')}</button><span id="scanReadyCount" class="cap">${Object.values(scanFiles).filter(Boolean).length}/3 · ${t('scanFileStatus')}</span></div><p class="cap">${t('scanNote')}</p><div id="scanMessage" class="scan-status" role="status">${complete?t('scanReady'):''}</div></div><section class="card"><h2>✓ ${t('scanReview')}</h2><div class="scan-preview">${fields.map(([a,b])=>scanInput(a,b)).join('')}</div><p class="cap" style="margin:12px 0">${t('scanWeaponHint')} ${t('scanGearReqNote')}</p><p class="cap">${t('scanNeedReview')}</p><div class="scan-tools"><button class="button primary" data-action="applyScreens" ${complete?'':'disabled'}>${t('scanApply')} →</button></div></section><section class="card"><h2>${t('scanParsed')}</h2>${['stat','weapon','gloves'].map(k=>`<div class="field" style="margin-bottom:10px"><label>${k.toUpperCase()}</label><textarea readonly id="scanRaw-${k}" placeholder="OCR text…">${safe(scanRaw[k])}</textarea></div>`).join('')}</section>`;}
function loadScanFile(key,file){if(!scanFiles.hasOwnProperty(key)||!file)return;if(!/^image\/(png|jpeg|webp)$/.test(file.type)){alert('PNG / JPG / WEBP');return;}if(file.size>12*1024*1024){alert('Max 12 MB');return;}if(scanURLs[key])URL.revokeObjectURL(scanURLs[key]);scanFiles[key]=file;scanURLs[key]=URL.createObjectURL(file);scanRaw[key]='';render();}
function clearScanner(){for(const k of Object.keys(scanFiles)){if(scanURLs[k])URL.revokeObjectURL(scanURLs[k]);scanURLs[k]=null;scanFiles[k]=null;scanRaw[k]='';}for(const k of Object.keys(scanValues))scanValues[k]='';render();}
function loadTesseract(){return new Promise((resolve,reject)=>{if(window.Tesseract){resolve(window.Tesseract);return;}const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';script.crossOrigin='anonymous';script.onload=()=>window.Tesseract?resolve(window.Tesseract):reject(new Error('Missing Tesseract'));script.onerror=()=>reject(new Error('OCR CDN unreachable'));document.head.appendChild(script);});}
function numFromOCR(v){let z=String(v).replace(/[Oо]/g,'0').replace(/[Il|]/g,'1').replace(/[, ]/g,'');const n=z.match(/[0-9]{1,5}/);return n?Number(n[0]):null;}
function extractStat(text){const t=text.replace(/[：]/g,':').replace(/[|]/g,'I');const fields={level:/\b(?:LV\.?|LEVEL)\s*[:.]?\s*(\d{1,3})\b/i,str:/\bSTR\s*[:.]?\s*(\d{1,4})/i,dex:/\bDEX\s*[:.]?\s*(\d{1,4})/i,int:/\bINT\s*[:.]?\s*(\d{1,4})/i,luk:/\bLUK\s*[:.]?\s*(\d{1,4})/i};const out={};for(const [k,pat] of Object.entries(fields)){const m=t.match(pat);if(m)out[k]=String(+m[1]);}return out;}
function extractGear(text,slot){const lines=text.replace(/：/g,':').split(/\r?\n/);const out={};const w=slot==='weapon'?'weaponAttack':'gloveAttack',m=slot==='weapon'?'weaponMagic':'gloveMagic';for(const line of lines){const x=line.trim().replace(/[Oо](?=\d)/g,'0');let match;if(/\b(?:W\.?\s*ATK|WEAPON\s*(?:ATT|ATK|ATTACK)|WEAPON\s*ATT\.|WA)\b/i.test(x)&&!/(?:REQUIR|SCROLL|POTENTIAL|BONUS\s*STAT)/i.test(x)){match=x.match(/(?:W\.?\s*ATK|WEAPON\s*(?:ATT|ATK|ATTACK)|WA)\s*[:.]*\s*\+?\s*(\d{1,4})\b/i);if(match)out[w]=match[1];}if(/\b(?:M\.?\s*ATK|MAGIC\s*(?:ATT|ATK|ATTACK)|MA)\b/i.test(x)&&!/(?:REQUIR|SCROLL|POTENTIAL|BONUS\s*STAT)/i.test(x)){match=x.match(/(?:M\.?\s*ATK|MAGIC\s*(?:ATT|ATK|ATTACK)|MA)\s*[:.]*\s*\+?\s*(\d{1,4})\b/i);if(match)out[m]=match[1];}}
// Optional secondary requirement from the weapon/gloves; other gear may require more.
const second=secondaryStat(prof());const req=new RegExp('(?:REQ(?:UIRED)?\\.?|NEEDED|NEEDS)\\s*\\.?\\s*'+second+'\\s*[:.]*\\s*(\\d{1,4})','i');const found=text.match(req);if(found)out.secondaryReq=found[1];return out;}
function scanStatus(msg){const el=$('scanMessage');if(el)el.textContent=msg;}
async function startOCR(){if(scanBusy||!Object.values(scanFiles).every(Boolean)){scanStatus(t('scanMissing'));return;}scanBusy=true;try{scanStatus(t('scanOCRWait')+'…');const lib=await loadTesseract();for(const k of ['stat','weapon','gloves']){scanStatus(t('scanOCRWait')+' '+k+'…');const output=await lib.recognize(scanFiles[k],'eng');const text=output?.data?.text||'';scanRaw[k]=text;const found=k==='stat'?extractStat(text):extractGear(text,k);if(found.secondaryReq!==undefined){found.secondaryReq=String(Math.max(num(scanValues.secondaryReq,0),num(found.secondaryReq,0)));}Object.assign(scanValues,found);const textBox=$('scanRaw-'+k);if(textBox)textBox.value=text;for(const [field,value] of Object.entries(scanValues)){const el=document.querySelector(`[data-scan-field="${field}"]`);if(el)el.value=value;}}
scanStatus(t('scanNeedReview'));}catch(err){console.warn('OCR error:',err);scanStatus(t('scanOCRFailed'));}finally{scanBusy=false;}}
function applyScanned(){if(!Object.values(scanFiles).every(Boolean)){scanStatus(t('scanMissing'));return;}const p=prof();for(const [k,v] of Object.entries(scanValues)){if(v!==''&&(!Number.isFinite(+v)||+v<0)){scanStatus(t('scanNeedReview'));return;}}if(['level','str','dex','int','luk'].some(k=>scanValues[k]==='')){scanStatus(t('scanNeedReview'));return;}const magic=isMagic(p),attackKey=magic?'weaponMagic':'weaponAttack';if(scanValues[attackKey]===''){scanStatus(t('scanNeedReview'));return;}for(const k of ['level','str','dex','int','luk'])p[k]=Math.max(k==='level'?1:4,Math.round(+scanValues[k]));if(magic){p.wandBase=+scanValues.weaponMagic;p.wandScroll=0;p.glovesM=scanValues.gloveMagic!==''?+scanValues.gloveMagic:0;}else{p.baseWeapon=+scanValues.weaponAttack;p.weaponScroll=0;p.glovesW=scanValues.gloveAttack!==''?+scanValues.gloveAttack:0;}p.secondaryReq=scanValues.secondaryReq!==''?Math.max(4,+scanValues.secondaryReq):p[(STATS[p.job]||STATS.il)[1]];reanchor(p);state.tab='sim';render();alert(t('scanApplied'));}
function renderBestiary(){const all=allMobs().filter(m=>m.name.toLowerCase().includes(state.bestFilter.toLowerCase())&&m.level>=state.bestMin);return `<div class="headline"><div><h1>◈ ${t('monsterTable')}</h1><p>${t('mobDisclaimer')}</p></div><span class="chip">${all.length} / ${allMobs().length} ${t('records')}</span></div><div class="card"><div class="between"><h2>${t('filter')}</h2><div class="selectrow"><button class="button sm" data-action="newMob">＋ ${t('addCustom')}</button><button class="button sm" data-action="exportMobs">↓ CSV</button><button class="button sm" data-action="importMobs">↑ CSV</button></div></div><div class="grid2"><div class="field"><label>${t('filter')}</label><input id="bestFilter" value="${safe(state.bestFilter)}" placeholder="Red Drake"></div><div class="field"><label>${t('minLvl')}</label><input id="bestMin" type="number" min="1" value="${state.bestMin}"></div></div><div class="tablebox" style="margin-top:14px;max-height:570px;overflow:auto"><table><thead><tr><th>${t('monster')}</th><th class="num">Lv</th><th class="num">HP</th><th class="num">M.DEF</th><th class="num">W.DEF</th><th class="num">EXP</th><th></th></tr></thead><tbody id="bestBody">${mobRows(all)}</tbody></table></div><p class="cap" style="margin-top:10px">${t('saveHint')}</p></div>`;}
function mobRows(mobs){return mobs.map(m=>`<tr><td><button class="click" data-usemob="${safe(m.name)}">${safe(m.name)}</button> ${m.custom?'<span class="smallpill green">Custom</span>':''}</td><td class="num">${fmt(m.level)}</td><td class="num">${fmt(m.hp)}</td><td class="num">${fmt(m.mdef)}</td><td class="num">${fmt(m.pdef)}</td><td class="num">${fmt(m.exp)}</td><td><button class="button sm" data-usemob="${safe(m.name)}">${t('choose')}</button></td></tr>`).join('')||`<tr><td colspan="7">${t('empty')}</td></tr>`;}
function renderCompare(){const p=prof();const mobs=allMobs().filter(m=>m.name.toLowerCase().includes(state.compareFilter.toLowerCase())&&m.level>=state.compareMin);
 const rows=mobs.map(m=>{const r=compute(p,m);return {m,r,chance:probabilities(p,m,r,450)[2]}}).sort((a,b)=>(b.m.exp/Math.max(1,b.r.avg)-a.m.exp/Math.max(1,a.r.avg)));
 return `<div class="headline"><div><h1>▥ ${t('comparison')}</h1><p>${t('compareHint')}</p></div><button class="button primary sm" data-action="exportCompare">↓ CSV</button></div><div class="card"><div class="grid2"><div class="field"><label>${t('filter')}</label><input id="compareFilter" value="${safe(state.compareFilter)}" placeholder="Drake"></div><div class="field"><label>${t('minLvl')}</label><input id="compareMin" type="number" min="1" value="${state.compareMin}"></div></div><div class="tablebox" style="max-height:680px;overflow:auto;margin-top:14px"><table><thead><tr><th>${t('monster')}</th><th class="num">Lv</th><th class="num">HP</th><th class="num">DEF</th><th class="num">EXP</th><th class="num">${t('effAvg')}</th><th class="num">${t('expectedHits')}</th><th class="num">${t('threeChance')}</th><th></th></tr></thead><tbody id="compareBody">${compareRows(rows)}</tbody></table></div><p class="cap">${t('critDisclaimer')} ${t('mobDisclaimer')}</p></div>`;}
function compareRows(rows){return rows.map(({m,r,chance})=>`<tr><td>${safe(m.name)}</td><td class="num">${fmt(m.level)}</td><td class="num">${fmt(m.hp)}</td><td class="num">${fmt(r.magic?m.mdef:m.pdef)}</td><td class="num">${fmt(m.exp)}</td><td class="num">${fmt(r.avg)}</td><td class="num">${r.avg>0?fmt(Math.ceil(m.hp/r.avg)):'—'}</td><td class="num" style="color:${chance>.9?'var(--mint)':'inherit'}">${pct(chance)}</td><td><button class="button sm" data-usemob="${safe(m.name)}">${t('choose')}</button></td></tr>`).join('')||`<tr><td colspan="9">${t('empty')}</td></tr>`;}

function renderNav(){document.documentElement.lang=state.lang;$('brandSubtitle').textContent=t('subtitle');$('nav').innerHTML=[['scan','📷 '+t('scanNav')],['sim','⚡ '+t('sim')],['mobs','◈ '+t('mobs')],['compare','▥ '+t('compare')],['docs','ⓘ '+t('docs')]].map(([id,label])=>`<button data-tab="${id}" class="${state.tab===id?'active':''}">${safe(label)}</button>`).join('');document.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('active',x.dataset.lang===state.lang));$('footer').innerHTML=`<div class="between"><span>ARCANE LAB 2.3 · ${t('credits')}</span><a href="${FORMULA_URL}" target="_blank" rel="noopener">MeowDB ↗</a></div>`;}
function render(){renderNav();$('root').innerHTML=state.tab==='scan'?renderScanner():state.tab==='sim'?renderForm():state.tab==='mobs'?renderBestiary():state.tab==='compare'?renderCompare():renderDocs();if(state.tab==='sim')renderResults();persist();}
let refreshToken=null;
function queueUpdate(){clearTimeout(refreshToken);refreshToken=setTimeout(()=>{if(state.tab==='sim')renderResults();persist();},95);}
function changeSkill(id){const p=prof();if(!SKILLS[id])return;p.skill=id;p.skillLevel=SKILLS[id].max;p.skillPower=SKILLS[id].power;const sm=spellMasteryAtLevel(id,p.skillLevel);if(sm!==null)p.mastery=sm;render();}
function setMobName(name){const m=findMob(name);if(!m)return false;prof().targetName=m.name;prof().targetOverride=null;prof().elemOverride='auto';state.tab='sim';render();return true;}
function saveMob(){const m=target();const name=prompt(t('monster'),m.name);if(!name?.trim())return;const record=normalizeMob({...m,name:name.trim(),custom:true,source:'Local user entry'});const ix=state.customMobs.findIndex(x=>x.name.toLowerCase()===record.name.toLowerCase());if(ix>=0)state.customMobs[ix]=record;else state.customMobs.push(record);prof().targetName=record.name;prof().targetOverride=null;render();}
function newMob(){prof().targetName='Custom monster';prof().targetOverride=normalizeMob({name:'Custom monster',level:30,hp:1000,mdef:0,pdef:0,eva:0,exp:0,undead:false,custom:true,source:'Local user entry'});state.tab='sim';render();}
function resetMob(){prof().targetOverride=null;render();}
function saveAs(name,content,mime){const url=URL.createObjectURL(new Blob([content],{type:mime}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function csv(rows){return '\ufeff'+rows.map(row=>row.map(x=>{const s=String(x??'');return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\r\n');}
function exportMobs(){saveAs('arcane_lab_monsters_v2.csv',csv([['name','level','hp','mdef','pdef','eva','exp','undead','ice','fire','lightning','holy','poison','source'],...allMobs().map(x=>[x.name,x.level,x.hp,x.mdef,x.pdef,x.eva,x.exp,x.undead?1:0,...['ice','fire','lightning','holy','poison'].map(k=>x.relations[k]),x.source])]),'text/csv;charset=utf-8');}
function exportCompare(){const p=prof();saveAs('arcane_lab_comparison_'+p.job+'.csv',csv([['monster','level','hp','mdef','pdef','exp','skill','min','avg','max','chance_1','chance_2','chance_3','chance_4','chance_5','chance_6'],...allMobs().map(m=>{const r=compute(p,m),c=probabilities(p,m,r,900);return [m.name,m.level,m.hp,m.mdef,m.pdef,m.exp,p.skill,(r.low*r.hits).toFixed(2),r.avg.toFixed(2),(r.high*r.hits).toFixed(2),...c.map(x=>(x*100).toFixed(2))];})]),'text/csv;charset=utf-8');}
function csvParse(text){let list=[],row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i];if(quoted){if(ch==='"'&&text[i+1]==='"'){field+='"';i++;}else if(ch==='"')quoted=false;else field+=ch;}else if(ch==='"')quoted=true;else if(ch===','){row.push(field);field='';}else if(ch==='\n'){row.push(field.replace(/\r$/,''));list.push(row);field='';row=[];}else field+=ch;}row.push(field.replace(/\r$/,''));if(row.some(x=>x!==''))list.push(row);return list;}
function importMobs(text){const rows=csvParse(text.replace(/^\ufeff/,'')),head=rows[0].map(x=>x.toLowerCase().trim());for(const k of ['name','level','hp','mdef'])if(!head.includes(k))throw Error('Missing '+k);let n=0;for(const row of rows.slice(1)){const d=Object.fromEntries(head.map((k,i)=>[k,row[i]??'']));if(!d.name||num(d.hp)<=0)continue;let m=normalizeMob({name:d.name,level:d.level,hp:d.hp,mdef:d.mdef,pdef:d.pdef,eva:d.eva,exp:d.exp,undead:['1','true','yes','si'].includes(String(d.undead).toLowerCase()),relations:Object.fromEntries(['ice','fire','lightning','holy','poison'].map(k=>[k,d[k]===''||d[k]===undefined?1:clamp(num(d[k],1),0,2)])),source:d.source||'CSV import',custom:true});const ix=state.customMobs.findIndex(x=>x.name.toLowerCase()===m.name.toLowerCase());if(ix>=0)state.customMobs[ix]=m;else state.customMobs.push(m);n++;}return n;}
function action(a){const p=prof();if(a==='openScanner'){state.tab='scan';render();window.scrollTo(0,0);}else if(a==='anchor'){reanchor(p);render();}else if(a==='readScreens'){startOCR();}else if(a==='applyScreens'){applyScanned();}else if(a==='clearScreens'){clearScanner();}else if(a==='save'){persist();alert(t('saveSuccess'));}else if(a==='addProfile'){const name=prompt(t('profileName'),state.lang==='en'?'New character':'Nuevo personaje');if(!name?.trim())return;const id='p'+Date.now();state.profiles[id]=baseProfile(p.job,name.trim());state.current=id;render();}else if(a==='rename'){const name=prompt(t('profileName'),p.name);if(name?.trim()){p.name=name.trim();render();}}else if(a==='delete'){if(Object.keys(state.profiles).length<=1)return;if(!confirm(t('removeConfirm')))return;delete state.profiles[state.current];state.current=Object.keys(state.profiles)[0];render();}else if(a==='saveMob')saveMob();else if(a==='newMob')newMob();else if(a==='resetMob')resetMob();else if(a==='exportMobs')exportMobs();else if(a==='importMobs')$('mobFile').click();else if(a==='exportCompare')exportCompare();}
// All controls use delegated events so sliders update output without losing drag position.
document.addEventListener('input',e=>{const el=e.target,p=prof();if(el.dataset.scanField){scanValues[el.dataset.scanField]=el.value.trim();return;}if(el.dataset.key){const k=el.dataset.key;let value=num(el.value);if(k==='level'||k==='medLevel'||k==='skillLevel'||k==='mastery'||k==='ironIndex'||k==='healUndead'||k==='healAllies')value=Math.round(value);if(k==='level')projectLevel(p,value);else p[k]=value;if(['int','luk','dex','str'].includes(k))reanchor(p);if(k==='secondaryReq'&&p.autoLevelOn)projectLevel(p,p.level);const peer=$( (el.type==='range'?'number-':'range-')+k );if(peer){if(peer.type==='range'&&value>num(peer.max))peer.max=String(value);peer.value=String(value);}if(k==='skillLevel'){const preset=powerByLevel(p.skill,p.skillLevel);p.skillPower=preset.power;const sm=spellMasteryAtLevel(p.skill,p.skillLevel);if(sm!==null)p.mastery=sm;const powerNumber=$('number-skillPower'),powerSlider=$('range-skillPower');if(powerNumber)powerNumber.value=String(p.skillPower);if(powerSlider)powerSlider.value=String(p.skillPower);const masteryNumber=$('number-mastery'),masterySlider=$('range-mastery');if(sm!==null){if(masteryNumber)masteryNumber.value=String(sm);if(masterySlider)masterySlider.value=String(sm);}}if(k==='level'&&p.autoLevelOn){for(const st of STATS[p.job]){const sn=$('number-'+st),sr=$('range-'+st);if(sn)sn.value=p[st];if(sr){if(p[st]>num(sr.max))sr.max=p[st];sr.value=p[st];}}}const md=$('medDerived');if(md)md.textContent='+'+meditationBonus(p);queueUpdate();}else if(el.dataset.target){const m=target();const key=el.dataset.target;m[key]=el.type==='checkbox'?el.checked:positive(el.value);m.custom=true;p.targetOverride=m;queueUpdate();}else if(el.id==='bestFilter'||el.id==='bestMin'){state.bestFilter=$('bestFilter').value;state.bestMin=positive($('bestMin').value);$('bestBody').innerHTML=mobRows(allMobs().filter(m=>m.name.toLowerCase().includes(state.bestFilter.toLowerCase())&&m.level>=state.bestMin));persist();}else if(el.id==='compareFilter'||el.id==='compareMin'){state.compareFilter=$('compareFilter').value;state.compareMin=positive($('compareMin').value);const p=prof(),list=allMobs().filter(m=>m.name.toLowerCase().includes(state.compareFilter.toLowerCase())&&m.level>=state.compareMin).map(m=>{const r=compute(p,m);return {m,r,chance:probabilities(p,m,r,450)[2]}}).sort((a,b)=>(b.m.exp/Math.max(1,b.r.avg)-a.m.exp/Math.max(1,a.r.avg)));$('compareBody').innerHTML=compareRows(list);persist();}});
document.addEventListener('change',e=>{const el=e.target,p=prof();if(el.dataset.scanJob){const old=prof();if(JOBS[el.value]&&old.job!==el.value){state.profiles[state.current]=normalizedProfile(baseProfile(el.value,old.name));render();}return;}if(el.dataset.scanFile){loadScanFile(el.dataset.scanFile,el.files?.[0]);return;}if(el.dataset.scanField){scanValues[el.dataset.scanField]=el.value.trim();return;}if(el.dataset.check){p[el.dataset.check]=el.checked;if(el.dataset.check==='autoLevelOn'&&el.checked)reanchor(p);queueUpdate();}else if(el.dataset.select){const k=el.dataset.select;if(k==='skill'){changeSkill(el.value);return;}p[k]=el.value;queueUpdate();}else if(el.id==='monsterSearch'){if(!setMobName(el.value))alert(state.lang==='en'?'Monster not found; create a custom monster.':'Monstruo no encontrado; crea uno personalizado.');}else if(el.id==='profileSelect'){state.current=el.value;render();}});
document.addEventListener('click',e=>{const x=e.target.closest('[data-tab],[data-lang],[data-job],[data-action],[data-usemob],[data-skillpick]');if(!x)return;if(x.dataset.lang){state.lang=x.dataset.lang;render();}else if(x.dataset.tab){state.tab=x.dataset.tab;render();window.scrollTo(0,0);}else if(x.dataset.job){const old=prof();if(old.job===x.dataset.job)return;state.profiles[state.current]=baseProfile(x.dataset.job,old.name);state.profiles[state.current].targetName=old.targetName;render();}else if(x.dataset.action){action(x.dataset.action);}else if(x.dataset.usemob){setMobName(x.dataset.usemob);window.scrollTo(0,0);}else if(x.dataset.skillpick){changeSkill(x.dataset.skillpick);}});
$('exportBackup').onclick=()=>saveAs('arcane_lab_backup_v2.json',JSON.stringify({format:'arcane-lab-v2',...state},null,2),'application/json');
$('importBackup').onclick=()=>$('backupFile').click();$('exportCompare').onclick=exportCompare;
function migrateBackup(data){
 // Old Arcane Lab 1.x stored magic-only fields with different names. Preserve users' saved characters.
 if(data.format!=='arcane-lab-v1'&&!Object.values(data.profiles||{}).some(p=>'wand' in p&&!('wandBase' in p)))return data;
 const profiles={};for(const [id,old] of Object.entries(data.profiles||{})){
  const job=JOBS[old.job]?old.job:'il';const p=baseProfile(job,old.name||id);
  Object.assign(p,{level:num(old.level,p.level),int:num(old.int,p.int),luk:num(old.luk,p.luk),wandBase:num(old.wand,69),wandScroll:num(old.scroll,16),glovesM:num(old.gloves,6),otherM:num(old.other,0),medOn:!!old.medOn,med:num(old.medValue,25),medLevel:num(old.medValue,25)>=25?20:Math.max(0,num(old.medValue,5)-4),potionOn:!!old.potOn,potionM:num(old.potValue,10),otherBuffM:num(old.extraBuff,0),skill:SKILLS[old.skill]?old.skill:p.skill,skillLevel:num(old.skillLevel,30),skillPower:num(old.skillPower,170),mastery:num(old.mastery,10),manualBonus:num(old.manualBonus,0),healUndead:num(old.healUndead,1),healAllies:num(old.healAllies,0),elemOverride:old.elemRel||'auto',targetBonus:num(old.extraTargetBonus,0),accuracyOn:!!old.accuracyOn,critOn:!!old.criticalOn,critRate:num(old.critChance,5),critBonus:num(old.critBonus,20),targetName:old.monster||'Red Drake'});
  profiles[id]=p;
 }
 return {format:'arcane-lab-v2',profiles,current:data.current,customMobs:data.customMobs||[],selectedMob:data.selectedMob,lang:'en',tab:'sim'};
}
$('backupFile').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const data=migrateBackup(JSON.parse(await file.text()));if(!data.profiles||!Object.keys(data.profiles).length)throw Error('Invalid profile data');if(!confirm(state.lang==='en'?'Replace current local profiles with this backup?':'¿Reemplazar perfiles locales por este respaldo?'))return;state={...defaults,...data,lang:TXT[data.lang]?data.lang:'en',tab:'sim'};Object.values(state.profiles).forEach(normalizedProfile);if(!state.profiles[state.current])state.current=Object.keys(state.profiles)[0];render();}catch(err){alert(err.message);}finally{e.target.value='';}};
$('mobFile').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{alert(importMobs(await file.text())+' '+t('records'));render();}catch(err){alert(err.message);}finally{e.target.value='';}};
render();
</script></body></html>
