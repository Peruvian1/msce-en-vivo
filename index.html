<html lang="es">
<head>
<meta charset="utf-8">

<script>
  // Proyecto Supabase y clave publicable (solo lectura). También sirven
  // ?url=https://<proyecto>.supabase.co&key=<clave> en la dirección.
  window.MSCE_LIVE = {"url": "https://egnbfgzkplmmljoxjrkj.supabase.co", "key": "sb_publishable_U9psXC6FeieZE7XZDK5d1w_pgGUW3OU"};
</script>
<style>
  :root {
    --bg: #f6f4ef; --panel: #ffffff; --text: #1f1d1a; --muted: #6b665d; --line: #e4dfd5;
    --accent: #b5762a; --accent-soft: #f6e7d2; --good: #2f7d4f; --bad: #b3412f; --new: #fff3c4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151412; --panel: #1f1d1a; --text: #f1ede6; --muted: #a39d92; --line: #34312c;
      --accent: #efb96d; --accent-soft: #3a2e1e; --good: #6cc48f; --bad: #ef8a76; --new: #4a3d14;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151412; --panel: #1f1d1a; --text: #f1ede6; --muted: #a39d92; --line: #34312c;
    --accent: #efb96d; --accent-soft: #3a2e1e; --good: #6cc48f; --bad: #ef8a76; --new: #4a3d14;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 14px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .3px; }
  h1 span { color: var(--accent); }
  #status { color: var(--muted); font-size: 13px; }
  #status.bad { color: var(--bad); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 6px; }
  #status.bad .dot { background: var(--bad); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .filters input, .filters select { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line);
         border-radius: 8px; padding: 7px 10px; min-width: 0; }
  .filters input[type=search] { flex: 1 1 220px; }
  .filters label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .tabs { display: flex; gap: 4px; margin-bottom: 10px; }
  .tabs button { font: inherit; color: var(--muted); background: transparent; border: 1px solid var(--line);
         border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .tabs button[aria-selected=true] { color: var(--text); background: var(--accent-soft); border-color: var(--accent); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 760px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 600;
       position: sticky; top: 0; background: var(--panel); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.small { color: var(--muted); font-size: 12px; }
  tr.fresh td { background: var(--new); transition: background 2s; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .tag.equip { border-color: var(--accent); color: var(--accent); }
  .tag.sold { border-color: var(--good); color: var(--good); }
  .legend { display: inline-flex; align-items: center; gap: 4px; margin-right: 12px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; }
  th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  th.sortable:hover { color: var(--text); }
  th.sortable[data-dir]::after { content: ' ▲'; font-size: 9px; }
  th.sortable[data-dir="-1"]::after { content: ' ▼'; }
  .filters.gear input[type=number] { width: 76px; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .ranges { display: flex; gap: 4px; margin: 6px 0; }
  .ranges button { font: inherit; font-size: 12px; color: var(--muted); background: transparent; border: 1px solid var(--line);
         border-radius: 999px; padding: 3px 12px; cursor: pointer; }
  .ranges button[aria-pressed=true] { color: var(--text); background: var(--accent-soft); border-color: var(--accent); }
  .chartwrap { position: relative; }
  .chart { width: 100%; height: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--muted); touch-action: none; }
  .chart text { fill: var(--muted); font-size: 11px; }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
         padding: 6px 9px; font-size: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.18); white-space: nowrap; z-index: 2; }
  .empty { padding: 28px; text-align: center; color: var(--muted); }
  .setup { max-width: 560px; margin: 40px auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .item-link { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
  .item-link:hover { color: var(--accent); }
  .back { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; margin: 12px 0; }
  .cards { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 14px; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; background: var(--bg); min-width: 110px; }
  .card b { display: block; font-size: 1.15em; }
  .card span { font-size: .8em; opacity: .7; }
  .setup input { width: 100%; margin: 6px 0 12px; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
                 background: var(--bg); color: var(--text); }
  .setup button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent-soft);
                  color: var(--text); cursor: pointer; }
</style>
</head>
<body>
<main>
  <header>
    <h1><span>MSCE</span> · Free Market en vivo</h1>
    <div id="status"><span class="dot"></span>Conectando…</div>
  </header>

  <section id="setup" class="setup" hidden>
    <p>Pon la dirección del proyecto Supabase y su clave publicable (solo lectura). Se guardan en este navegador.</p>
    <label>Dirección del proyecto<input id="setup-url" placeholder="https://xxxx.supabase.co"></label>
    <label>Clave publicable<input id="setup-key" placeholder="eyJ… o sb_publishable_…"></label>
    <button id="setup-save">Conectar</button>
  </section>

  <section id="live" hidden>
    <div class="filters">
      <input id="q" type="search" placeholder="Buscar ítem, jugador o tienda">
      <select id="world"><option value="">Todos los mundos</option></select>
      <select id="channel"><option value="">Todos los canales</option></select>
      <select id="kind">
        <option value="">Todos los ítems</option>
        <option value="equip">Solo equipo</option>
        <option value="plain">Sin estadísticas</option>
        <option value="sold">Solo vendidos</option>
      </select>
      <label><input id="recent" type="checkbox" checked> Últimas 24 h</label>
    </div>
    <div class="filters gear" id="gear">
      <select id="group" title="Grupo de equipo"><option value="">Todo tipo de ítem</option><option value="weapon">Armas</option><option value="armor">Armadura</option><option value="accessory">Accesorios</option></select>
      <select id="cat" title="Tipo de equipo"><option value="">Todos los tipos</option></select>
      <select id="job" title="Clase"><option value="">Todas las clases</option><option value="Warrior">Guerrero</option><option value="Magician">Mago</option><option value="Bowman">Arquero</option><option value="Thief">Ladrón</option><option value="Pirate">Pirata</option><option value="common">Sin clase (cualquiera)</option></select>
      <select id="lvlpre" title="Rango de nivel"><option value="">Cualquier nivel</option><option value="0-29">Nivel 1–29</option><option value="30-49">Nivel 30–49</option><option value="50-69">Nivel 50–69</option><option value="70-99">Nivel 70–99</option><option value="100-250">Nivel 100+</option></select>
      <label>Nivel <input id="lmin" type="number" min="0" max="250" placeholder="desde"> – <input id="lmax" type="number" min="0" max="250" placeholder="hasta"></label>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="offers">Ofertas recientes</button>
      <button role="tab" aria-selected="false" data-tab="prices">Precios por ítem</button>
      <button role="tab" aria-selected="false" data-tab="deals">Ofertas baratas</button>
      <button role="tab" aria-selected="false" data-tab="best">Más vendidos</button>
    </div>
    <div class="panel"><div id="detail" hidden></div><table id="table"></table></div>
  </section>
</main>
<script>
(function () {
  const POLL_MS = 5000, LIMIT = 2000;
  const params = new URLSearchParams(location.search);
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem('msce-live') || '{}'); } catch (e) {}
  let base = (params.get('url') || window.MSCE_LIVE.url || saved.url || '').replace(/\/+$/, '');
  let key = params.get('key') || window.MSCE_LIVE.key || saved.key || '';
  const offers = new Map();
  const fresh = new Set();
  let newest = null, lastOk = null, tab = 'offers', timer = null;

  const $ = (id) => document.getElementById(id);
  const fmt = new Intl.NumberFormat('es');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  const ago = (iso) => {
    if (!iso) return '';
    const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 60) return `hace ${Math.round(s)} s`;
    if (s < 3600) return `hace ${Math.round(s / 60)} min`;
    if (s < 86400) return `hace ${Math.round(s / 3600)} h`;
    return new Date(iso).toLocaleDateString('es');
  };
  const pad2 = (n) => String(n).padStart(2, '0');
  // 31/10/2026 22:05 (día/mes/año hora:minutos, hora local del navegador)
  const when = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    return `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  };
  const baseItem = (name) => String(name || '').replace(/(?:\s*\(\+\d+\))+$/, '').trim();
  const median = (v) => { const s = [...v].sort((a, b) => a - b), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
  const mean = (v) => v.reduce((a, b) => a + b, 0) / v.length;
  // Fila gris en la tienda: alguien ya la compró. Su precio es una venta, no una oferta.
  const isSold = (o) => o.state === 'faded';
  const soldTag = (o) => isSold(o) ? ' <span class="tag sold">vendido</span>' : '';
  const stamp = (o) => new Date(o.seen_at || o.uploaded_at).getTime();
  // Una fila gris sigue en la tienda: en cada visita se ve la misma venta. Se cuenta una sola vez
  // (jugador, ítem, precio, cantidad y posición en la lista); queda la copia con más estadísticas.
  const saleKey = (o) => o.slot != null && o.slot !== '' && !String(o.slot).startsWith('R')
    ? `${o.seller}|${baseItem(o.item).toLowerCase()}|${o.price}|${o.quantity}|${o.slot}` : null;
  function dedupeSold(list) {
    const seen = new Map(), out = [];
    for (const o of list) {
      const key = isSold(o) ? saleKey(o) : null;
      if (!key) { out.push(o); continue; }
      const at = seen.get(key);
      if (at === undefined) { seen.set(key, out.length); out.push(o); continue; }
      const kept = out[at], n = (x) => Object.keys(x.stats || {}).length;
      if (n(o) > n(kept) || (n(o) === n(kept) && (o.uploaded_at || '') > (kept.uploaded_at || ''))) out[at] = o;
    }
    return out;
  }
  // Precios absurdos (un error o un troll) solo se descartan en consumibles y otros ítems sin estadísticas:
  // un equipo con sus mejoras perfectas puede valer 100 veces más y es un precio real.
  function typical(rows) {
    if (!rows.length || rows[0].item_kind !== 'plain') return {kept: rows, dropped: 0};
    const priced = rows.filter((o) => o.unit_price != null);
    if (priced.length < 6) return {kept: rows, dropped: 0};
    const med = median(priced.map((o) => Number(o.unit_price)));
    const kept = rows.filter((o) => o.unit_price == null || (Number(o.unit_price) <= med * 20 && Number(o.unit_price) >= med / 20));
    return {kept, dropped: rows.length - kept.length};
  }
  let selected = null;
  const stats = (o) => Object.entries(o.stats || {}).map(([k, v]) => k === 'Remaining Enhancements' ? `${k}: ${v}` : `${k} ${v > 0 ? '+' : ''}${v}`).join(' · ');
  const place = (o) => `Ch ${o.channel ?? '?'} · Sala ${o.room ?? '?'}`;

  // Tipo, nivel y clase de cada equipo (catalog.json, del catálogo del juego).
  const ES = {Hat: 'Sombrero', Top: 'Camiseta', Bottom: 'Pantalón', Overall: 'Overall', Shoes: 'Zapatos', Glove: 'Guantes', Cape: 'Capa', Shield: 'Escudo',
    Earrings: 'Aretes', Claw: 'Garras', 'One-Handed Blunt Weapon': 'Maza 1 mano', Dagger: 'Daga', 'One-Handed Sword': 'Espada 1 mano', Bow: 'Arco',
    'One-Handed Axe': 'Hacha 1 mano', 'Two-Handed Sword': 'Espada 2 manos', Wand: 'Varita', Crossbow: 'Ballesta', 'Pole Arm': 'Lanza larga',
    'Two-Handed Axe': 'Hacha 2 manos', 'Two-Handed Blunt': 'Maza 2 manos', Spear: 'Lanza', Staff: 'Bastón'};
  const JOBS = {Warrior: 'Guerrero', Magician: 'Mago', Bowman: 'Arquero', Thief: 'Ladrón', Pirate: 'Pirata'};
  const GROUPS = {
    weapon: ['Claw', 'One-Handed Blunt Weapon', 'Dagger', 'One-Handed Sword', 'Bow', 'One-Handed Axe', 'Two-Handed Sword', 'Wand', 'Crossbow', 'Pole Arm', 'Two-Handed Axe', 'Two-Handed Blunt', 'Spear', 'Staff'],
    armor: ['Hat', 'Top', 'Bottom', 'Overall', 'Shoes', 'Glove', 'Cape', 'Shield'],
    accessory: ['Earrings']};
  let catalog = new Map();
  const metaOf = (name) => { const k = baseItem(name).toLowerCase(); return catalog.get(k) || catalog.get(k.replace(/\s*\([mf]\)$/, '')) || null; };
  const metaText = (name) => {
    const m = metaOf(name);
    return m ? `${ES[m.cat] || m.cat} · Nivel ${m.level} · ${m.jobs.length ? m.jobs.map((j) => JOBS[j] || j).join('/') : 'Sin clase requerida'}` : '';
  };
  function gearOk(name) {
    const group = $('group').value, cat = $('cat').value, job = $('job').value, lmin = $('lmin').value, lmax = $('lmax').value;
    if (!group && !cat && !job && lmin === '' && lmax === '') return true;
    const m = metaOf(name);
    if (!m) return false;
    if (group && !GROUPS[group].includes(m.cat)) return false;
    if (cat && m.cat !== cat) return false;
    if (job === 'common' ? m.jobs.length : job && m.jobs.length && !m.jobs.includes(job)) return false;
    if (lmin !== '' && m.level < Number(lmin)) return false;
    if (lmax !== '' && m.level > Number(lmax)) return false;
    return true;
  }
  function fillCats() {
    const group = $('group').value, select = $('cat'), current = select.value;
    const cats = (group ? GROUPS[group] : Object.values(GROUPS).flat()).filter((c) => [...catalog.values()].some((m) => m.cat === c));
    select.innerHTML = '<option value="">Todos los tipos</option>' + cats.map((c) => `<option value="${esc(c)}">${esc(ES[c] || c)}</option>`).join('');
    select.value = cats.includes(current) ? current : '';
  }
  // Mediana de los últimos 7 días de cada ítem (ofertas y ventas), sin precios absurdos en consumibles.
  function baselines(all) {
    const since = Date.now() - 7 * 86400000, byItem = new Map();
    for (const o of all) {
      if (o.unit_price == null || stamp(o) < since || (o.state && o.state !== 'active' && !isSold(o))) continue;
      const k = baseItem(o.item);
      if (!byItem.has(k)) byItem.set(k, []);
      byItem.get(k).push(o);
    }
    const out = new Map();
    for (const [k, rows] of byItem) {
      // Un equipo vale según sus estadísticas: su referencia son las ventas reales (8 o más), no lo que piden.
      const used = rows[0].item_kind === 'plain' ? typical(rows).kept : rows.filter(isSold);
      const kept = used.map((o) => Number(o.unit_price));
      if (kept.length >= (rows[0].item_kind === 'plain' ? 5 : 8)) out.set(k, {med: median(kept), n: kept.length});
    }
    return out;
  }
  // Cambio de la mediana de las últimas 24 h contra las 24 h anteriores, por ítem.
  function dayChange(all) {
    const now = Date.now(), by = new Map();
    for (const o of all) {
      if (o.unit_price == null || (o.state && o.state !== 'active' && !isSold(o))) continue;
      const age = now - stamp(o), k = baseItem(o.item);
      if (age > 2 * 86400000) continue;
      if (!by.has(k)) by.set(k, {now: [], before: [], kind: o.item_kind});
      by.get(k)[age <= 86400000 ? 'now' : 'before'].push(Number(o.unit_price));
    }
    const out = new Map();
    for (const [k, g] of by) {
      if (g.now.length < 3 || g.before.length < 3) continue;
      const trim = (v) => { if (g.kind !== 'plain') return v; const m = median(v); return v.filter((x) => x <= m * 20 && x >= m / 20); };
      const a = median(trim(g.now)), b = median(trim(g.before));
      if (b > 0) out.set(k, (a - b) / b);
    }
    return out;
  }
  const pct = (v) => v == null ? '—' : `<span style="color:var(--${v > 0.005 ? 'bad' : v < -0.005 ? 'good' : 'muted'})">${v > 0 ? '+' : ''}${(v * 100).toFixed(0)}%</span>`;
  // Orden de las tablas: se cambia con un clic en el encabezado.
  const sorts = {offers: {key: 'seen', dir: -1}, prices: {key: 'item', dir: 1}, deals: {key: 'off', dir: -1}, best: {key: 'mesos', dir: -1}};
  const th = (tabName, key, label) => {
    const s = sorts[tabName];
    return `<th class="sortable" data-tab="${tabName}" data-sort="${key}"${s.key === key ? ` data-dir="${s.dir}"` : ''}>${label}</th>`;
  };
  const cmp = (a, b) => (typeof a === 'string' || typeof b === 'string') ? String(a).localeCompare(String(b)) : a - b;
  const sortBy = (list, tabName, keys) => {
    const s = sorts[tabName], f = keys[s.key] || keys[Object.keys(keys)[0]];
    return list.sort((a, b) => s.dir * cmp(f(a), f(b)) || cmp(keys.item(a), keys.item(b)));
  };

  function setStatus(text, bad) {
    $('status').className = bad ? 'bad' : '';
    $('status').innerHTML = '<span class="dot"></span>' + esc(text);
  }

  async function fetchRows(since) {
    let url = `${base}/rest/v1/msce_offers?select=*&order=uploaded_at.desc&limit=${LIMIT}`;
    if (since) url += `&uploaded_at=gt.${encodeURIComponent(since)}`;
    const response = await fetch(url, {headers: {apikey: key, Authorization: `Bearer ${key}`}});
    if (!response.ok) throw new Error(`HTTP ${response.status}: ${(await response.text()).slice(0, 160)}`);
    return response.json();
  }

  async function poll() {
    try {
      const rows = await fetchRows(newest);
      const first = newest === null;
      for (const row of rows) {
        offers.set(row.record_id, row);
        if (!first) fresh.add(row.record_id);
        if (!newest || row.uploaded_at > newest) newest = row.uploaded_at;
      }
      lastOk = new Date();
      if (rows.length || first) { fillFilters(); render(); }
      setStatus(`En vivo · ${fmt.format(offers.size)} ofertas · última subida ${ago(newest) || '—'}`);
      if (fresh.size) setTimeout(() => { fresh.clear(); render(); }, 2500);
    } catch (error) {
      setStatus(`Sin conexión con la base (${error.message}). Reintento en 5 s.`, true);
    } finally {
      timer = setTimeout(poll, POLL_MS);
    }
  }

  function fillFilters() {
    for (const [id, field, label] of [['world', 'world', 'Todos los mundos'], ['channel', 'channel', 'Todos los canales']]) {
      const select = $(id), current = select.value;
      const values = [...new Set([...offers.values()].map((o) => o[field]).filter((v) => v !== null && v !== undefined))]
        .sort((a, b) => (typeof a === 'number' ? a - b : String(a).localeCompare(String(b))));
      select.innerHTML = `<option value="">${label}</option>` + values.map((v) =>
        `<option value="${esc(v)}">${id === 'channel' ? 'Canal ' + esc(v) : esc(v)}</option>`).join('');
      select.value = current;
    }
  }

  function visible() {
    const q = $('q').value.trim().toLowerCase(), world = $('world').value, channel = $('channel').value, kind = $('kind').value;
    const since = $('recent').checked ? Date.now() - 86400000 : 0;
    return dedupeSold([...offers.values()]).filter((o) =>
      (!q || [o.item, o.seller, o.shop_name].some((v) => String(v || '').toLowerCase().includes(q))) &&
      (!world || String(o.world) === world) && (!channel || String(o.channel) === channel) &&
      (!kind || (kind === 'sold' ? isSold(o) : kind === 'plain' ? o.item_kind === 'plain' : o.item_kind !== 'plain')) &&
      gearOk(o.item) && (!since || new Date(o.seen_at || o.uploaded_at).getTime() >= since));
  }

  // Historial completo del ítem elegido: se pide a la base aparte, porque la lista en vivo guarda solo lo más reciente.
  let history = null, range = '7d';
  async function loadHistory(item) {
    history = null;
    try {
      const url = `${base}/rest/v1/msce_offers?select=*&item=ilike.${encodeURIComponent(item + '*')}&order=uploaded_at.desc&limit=5000`;
      const response = await fetch(url, {headers: {apikey: key, Authorization: `Bearer ${key}`}});
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const rows = await response.json();
      if (selected === item) { history = rows.filter((o) => baseItem(o.item).toLowerCase() === item.toLowerCase()); render(); }
    } catch (error) {
      if (selected === item) { history = []; render(); }
    }
  }
  const RANGES = {'24h': 1, '7d': 7, '30d': 30, 'all': Infinity};
  const compact = (v) => v >= 1e6 ? `${+(v / 1e6).toFixed(v >= 1e7 ? 0 : 2)}M` : v >= 1e4 ? `${Math.round(v / 1e3)}k` : v >= 1e3 ? `${+(v / 1e3).toFixed(1)}k` : String(Math.round(v));

  function renderDetail() {
    const world = $('world').value, channel = $('channel').value;
    const all = new Map();
    for (const o of [...(history || []), ...offers.values()]) if (baseItem(o.item).toLowerCase() === selected.toLowerCase()) all.set(o.record_id, o);
    const copies = dedupeSold([...all.values()]).filter((o) => (!world || String(o.world) === world) && (!channel || String(o.channel) === channel))
      .sort((a, b) => (b.seen_at || b.uploaded_at || '').localeCompare(a.seen_at || a.uploaded_at || ''));
    const pricedAll = typical(copies.filter((o) => o.unit_price != null && (!o.state || o.state === 'active')));
    const soldAll = typical(copies.filter((o) => o.unit_price != null && isSold(o)));
    const priced = pricedAll.kept, sold = soldAll.kept, ignored = pricedAll.dropped + soldAll.dropped;
    const prices = priced.map((o) => Number(o.unit_price)), soldPrices = sold.map((o) => Number(o.unit_price));
    const box = $('detail');
    let cards = '<p class="small">No hay copias de este ítem con los filtros elegidos.</p>', plot = null;
    if (prices.length || soldPrices.length) {
      cards = '';
      if (prices.length) {
        const first = Math.min(...priced.map(stamp)), last = Math.max(...priced.map(stamp));
        cards += `<h3 style="margin:8px 0 0">En venta</h3><div class="cards">
        <div class="card"><b>${fmt.format(Math.round(mean(prices)))}</b><span>Precio promedio / u.</span></div>
        <div class="card"><b>${fmt.format(Math.round(median(prices)))}</b><span>Mediana / u.</span></div>
        <div class="card"><b>${fmt.format(Math.min(...prices))}</b><span>Mínimo</span></div>
        <div class="card"><b>${fmt.format(Math.max(...prices))}</b><span>Máximo</span></div>
        <div class="card"><b>${priced.length}</b><span>Copias registradas</span></div>
        <div class="card"><b class="small">${esc(when(new Date(first).toISOString()))}</b><span>Primera vez visto</span></div>
        <div class="card"><b class="small">${esc(when(new Date(last).toISOString()))}</b><span>Última vez visto</span></div></div>`;
      }
      if (soldPrices.length) {
        const lastSale = sold.reduce((a, b) => (stamp(b) > stamp(a) ? b : a));
        cards += `<h3 style="margin:8px 0 0">Vendidos</h3><div class="cards">
        <div class="card"><b>${fmt.format(Math.round(mean(soldPrices)))}</b><span>Precio de venta promedio / u.</span></div>
        <div class="card"><b>${fmt.format(Math.round(median(soldPrices)))}</b><span>Mediana de venta / u.</span></div>
        <div class="card"><b>${fmt.format(Math.min(...soldPrices))}</b><span>Venta más baja</span></div>
        <div class="card"><b>${fmt.format(Math.max(...soldPrices))}</b><span>Venta más alta</span></div>
        <div class="card"><b>${sold.length}</b><span>Ventas registradas</span></div>
        <div class="card"><b class="small">${fmt.format(Number(lastSale.unit_price))} · ${esc(when(lastSale.seen_at || lastSale.uploaded_at))}</b><span>Última venta vista</span></div></div>`;
      }
      const since = RANGES[range] === Infinity ? 0 : Date.now() - RANGES[range] * 86400000;
      plot = chart(priced.filter((o) => stamp(o) >= since), sold.filter((o) => stamp(o) >= since));
      cards += '<h3 style="margin:8px 0 0">Curva de precio</h3><div class="ranges">' +
        Object.keys(RANGES).map((r) => `<button data-range="${r}" aria-pressed="${r === range}">${r === 'all' ? 'Todo' : r === '24h' ? '24 h' : r.replace('d', ' días')}</button>`).join('') +
        (history === null ? '<span class="small" style="align-self:center;margin-left:8px">Cargando el historial…</span>' : '') + '</div>' + plot.html;
    }
    if (ignored) cards = `<p class="small">${ignored} precio${ignored > 1 ? 's' : ''} atípico${ignored > 1 ? 's' : ''} (más de 20 veces la mediana) no cuenta${ignored > 1 ? 'n' : ''} en los promedios ni en la curva.</p>` + cards;
    const m = metaText(selected);
    box.innerHTML = `<button class="back" id="back">← Volver</button><h2 style="margin:4px 0">${esc(selected)}</h2>${m ? `<div class="meta">${esc(m)}</div>` : ''}` + cards +
      '<table><thead><tr><th>Visto</th><th>Ítem</th><th>Cant.</th><th>Precio</th><th>Por unidad</th><th>Jugador</th><th>Tienda</th><th>Lugar</th><th>Estadísticas</th></tr></thead><tbody>' +
      copies.slice(0, 300).map((o) => `<tr><td class="small">${esc(when(o.seen_at || o.uploaded_at))}</td><td>${esc(o.item)}${soldTag(o)}</td>
        <td class="num">${fmt.format(o.quantity)}</td><td class="num">${fmt.format(o.price)}</td>
        <td class="num">${o.unit_price != null ? fmt.format(o.unit_price) : ''}</td><td>${esc(o.seller)}</td><td>${esc(o.shop_name || '')}</td>
        <td class="small">${esc(o.world)} · ${esc(place(o))}</td>
        <td class="small">${esc(stats(o) || (o.item_kind === 'plain' ? '—' : o.stats_complete ? '' : 'pendientes'))}</td></tr>`).join('') + '</tbody></table>';
    $('back').addEventListener('click', () => { selected = null; history = null; render(); });
    box.querySelectorAll('.ranges button').forEach((button) => button.addEventListener('click', () => { range = button.dataset.range; render(); }));
    if (plot) plot.bind(box);
  }

  // Curva de precio: por hora (hasta 2 días) o por día, la mediana y el mínimo de lo que estaba en venta,
  // los puntos de cada copia vista y, en verde, las ventas (filas grises del juego). Pasa el puntero por encima para ver el detalle.
  function chart(priced, sold) {
    const none = {html: '<p class="small">No hay datos en este rango.</p>', bind() {}};
    const pts = [...priced, ...sold];
    if (!pts.length) return none;
    const times = pts.map(stamp), t0 = Math.min(...times), t1 = Math.max(...times);
    const bucket = t1 - t0 <= 2 * 86400000 ? 3600000 : 86400000;
    const groups = new Map();
    const add = (o, field) => {
      const t = Math.floor(stamp(o) / bucket) * bucket;
      if (!groups.has(t)) groups.set(t, {t, l: [], s: []});
      groups.get(t)[field].push(Number(o.unit_price));
    };
    priced.forEach((o) => add(o, 'l')); sold.forEach((o) => add(o, 's'));
    const data = [...groups.values()].sort((a, b) => a.t - b.t).map((g) => ({t: g.t, n: g.l.length, min: g.l.length ? Math.min(...g.l) : null,
      med: g.l.length ? median(g.l) : null, sn: g.s.length, smed: g.s.length ? median(g.s) : null}));
    const W = 800, H = 250, L = 54, R = 12, T = 12, B = 28;
    const shown = data.flatMap((d) => [d.min, d.med, d.smed]).concat(sold.map((o) => Number(o.unit_price))).filter((v) => v != null);
    let lo = Math.min(...shown), hi = Math.max(...shown);
    const pad = hi === lo ? Math.max(1, hi * .1) : (hi - lo) * .1;
    lo = Math.max(0, lo - pad); hi += pad;
    const xa = data[0].t - bucket / 2, xb = data[data.length - 1].t + bucket / 2;
    const X = (t) => L + (xb === xa ? (W - L - R) / 2 : (t - xa) / (xb - xa) * (W - L - R));
    const Y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
    const line = (field, color, dash) => {
      const part = data.filter((d) => d[field] != null);
      if (!part.length) return '';
      const path = part.map((d, i) => `${i ? 'L' : 'M'}${X(d.t + bucket / 2).toFixed(1)},${Y(d[field]).toFixed(1)}`).join('');
      return `<path d="${path}" fill="none" stroke="${color}" stroke-width="2"${dash ? ' stroke-dasharray="5 4"' : ''}/>` +
        part.map((d) => `<circle cx="${X(d.t + bucket / 2).toFixed(1)}" cy="${Y(d[field]).toFixed(1)}" r="2.6" fill="${color}"/>`).join('');
    };
    let grid = '';
    for (let i = 0; i <= 4; i++) {
      const v = lo + (hi - lo) * i / 4, y = Y(v).toFixed(1);
      grid += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 6}" y="${+y + 4}" text-anchor="end">${compact(v)}</text>`;
    }
    const span = xb - xa;
    for (let i = 0; i <= 4; i++) {
      const t = xa + span * i / 4, d = new Date(t);
      const label = span <= 2 * 86400000 ? `${pad2(d.getHours())}:${pad2(d.getMinutes())}` : `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}`;
      grid += `<text x="${X(t).toFixed(1)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === 4 ? 'end' : 'middle'}">${label}</text>`;
    }
    const dots = priced.map((o) => Number(o.unit_price)).map((v, i) => v >= lo && v <= hi ?
      `<circle cx="${X(stamp(priced[i])).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="1.8" fill="currentColor" opacity=".25"/>` : '').join('');
    const saleDots = sold.map((o) => `<circle cx="${X(stamp(o)).toFixed(1)}" cy="${Y(Number(o.unit_price)).toFixed(1)}" r="3.5" fill="var(--good)" stroke="var(--panel)" stroke-width="1"/>`).join('');
    const legend = '<span class="legend"><i style="background:var(--accent)"></i>mediana en venta</span><span class="legend"><i style="background:var(--muted)"></i>mínimo en venta</span>' +
      (sold.length ? '<span class="legend"><i style="background:var(--good)"></i>vendido</span>' : '');
    const html = `<div class="chartwrap"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Curva de precio por unidad">${grid}${dots}${line('min', 'var(--muted)', true)}${line('med', 'var(--accent)')}${line('smed', 'var(--good)')}${saleDots}<line id="cursor" class="grid" y1="${T}" y2="${H - B}" x1="0" x2="0" style="display:none"/></svg><div class="tip" hidden></div></div>
      <p class="small">${legend}Un punto por ${bucket === 3600000 ? 'hora' : 'día'}; los puntos tenues son cada copia vista. De ${fmt.format(Math.round(Math.min(...shown)))} a ${fmt.format(Math.round(Math.max(...shown)))} por unidad.</p>`;
    const bind = (box) => {
      const svg = box.querySelector('svg.chart'), tip = box.querySelector('.tip'), cursor = svg.querySelector('#cursor');
      const leave = () => { tip.hidden = true; cursor.style.display = 'none'; };
      svg.addEventListener('mouseleave', leave);
      svg.addEventListener('mousemove', (event) => {
        const rect = svg.getBoundingClientRect(), x = (event.clientX - rect.left) / rect.width * W;
        const near = data.reduce((a, d) => (Math.abs(X(d.t + bucket / 2) - x) < Math.abs(X(a.t + bucket / 2) - x) ? d : a));
        const cx = X(near.t + bucket / 2);
        cursor.style.display = ''; cursor.setAttribute('x1', cx); cursor.setAttribute('x2', cx);
        tip.innerHTML = `<b>${esc(when(new Date(near.t).toISOString()))}</b><br>` +
          (near.n ? `En venta: ${near.n} · mín ${fmt.format(near.min)} · mediana ${fmt.format(Math.round(near.med))}<br>` : '') +
          (near.sn ? `Vendidos: ${near.sn} · mediana ${fmt.format(Math.round(near.smed))}` : '');
        tip.hidden = false;
        const wrap = box.querySelector('.chartwrap').getBoundingClientRect();
        tip.style.left = Math.min(Math.max(0, event.clientX - wrap.left + 12), Math.max(0, wrap.width - tip.offsetWidth)) + 'px';
        tip.style.top = Math.max(0, event.clientY - wrap.top - tip.offsetHeight - 10) + 'px';
      });
    };
    return {html, bind};
  }

  function render() {
    const rows = visible(), table = $('table');
    $('detail').hidden = selected === null; table.hidden = selected !== null;
    if (selected !== null) { renderDetail(); return; }
    if (!rows.length) { table.innerHTML = '<tr><td class="empty">Todavía no hay ofertas con estos filtros.</td></tr>'; return; }
    const level = (name) => { const m = metaOf(name); return m ? m.level : -1; };
    const levelText = (name) => { const m = metaOf(name); return m ? m.level : '—'; };
    if (tab === 'offers') {
      sortBy(rows, 'offers', {seen: (o) => o.uploaded_at || '', item: (o) => baseItem(o.item).toLowerCase(), level: (o) => level(o.item),
        price: (o) => Number(o.price), unit: (o) => Number(o.unit_price ?? -1), seller: (o) => String(o.seller || '').toLowerCase()});
      table.innerHTML = `<thead><tr>${th('offers', 'seen', 'Visto')}${th('offers', 'item', 'Ítem')}${th('offers', 'level', 'Nivel')}<th>Cant.</th>${th('offers', 'price', 'Precio')}${th('offers', 'unit', 'Por unidad')}${th('offers', 'seller', 'Jugador')}<th>Tienda</th><th>Lugar</th><th>Estadísticas</th></tr></thead><tbody>` +
        rows.slice(0, 500).map((o) => `<tr class="${fresh.has(o.record_id) ? 'fresh' : ''}">
          <td class="small" title="${esc(ago(o.seen_at || o.uploaded_at))}">${esc(when(o.seen_at || o.uploaded_at))}</td>
          <td><a class="item-link" data-item="${esc(baseItem(o.item))}">${esc(o.item)}</a> ${o.item_kind === 'equip' ? '<span class="tag equip">equipo</span>' : ''}${soldTag(o)}${metaOf(o.item) ? `<div class="meta">${esc(metaText(o.item))}</div>` : ''}</td>
          <td class="num small">${levelText(o.item)}</td>
          <td class="num">${fmt.format(o.quantity)}</td><td class="num">${fmt.format(o.price)}</td>
          <td class="num">${o.unit_price != null ? fmt.format(o.unit_price) : ''}</td>
          <td>${esc(o.seller)}</td><td>${esc(o.shop_name || '')}</td>
          <td class="small">${esc(o.world)} · ${esc(place(o))}</td>
          <td class="small">${esc(stats(o) || (o.item_kind === 'plain' ? '—' : o.stats_complete ? '' : 'pendientes'))}</td></tr>`).join('') + '</tbody>';
    } else if (tab === 'best') {
      // Lo que más se vendió (filas grises: ventas reales), por cantidad de ventas, unidades o mesos movidos.
      const byItem = new Map();
      for (const o of rows) {
        if (!isSold(o) || o.unit_price == null) continue;
        const k = baseItem(o.item);
        if (!byItem.has(k)) byItem.set(k, {item: k, kind: o.item_kind, sales: 0, units: 0, mesos: 0, prices: []});
        const g = byItem.get(k);
        g.sales += 1; g.units += Number(o.quantity) || 1; g.mesos += Number(o.price) || 0; g.prices.push(Number(o.unit_price));
      }
      const list = [...byItem.values()].map((g) => ({...g, med: median(typical(g.prices.map((p) => ({item_kind: g.kind, unit_price: p}))).kept.map((r) => r.unit_price))}));
      if (!list.length) { table.innerHTML = '<tr><td class="empty">Todavía no hay ventas con estos filtros.</td></tr>'; return; }
      sortBy(list, 'best', {mesos: (g) => g.mesos, sales: (g) => g.sales, units: (g) => g.units, item: (g) => g.item.toLowerCase(), level: (g) => level(g.item), med: (g) => g.med});
      const total = list.reduce((a, g) => a + g.mesos, 0);
      table.innerHTML = `<thead><tr>${th('best', 'item', 'Ítem')}${th('best', 'level', 'Nivel')}${th('best', 'sales', 'Ventas')}${th('best', 'units', 'Unidades')}${th('best', 'mesos', 'Mesos')}<th>% del total</th>${th('best', 'med', 'Mediana de venta / u.')}</tr></thead><tbody>` +
        list.slice(0, 300).map((g) => `<tr><td><a class="item-link" data-item="${esc(g.item)}">${esc(g.item)}</a> ${g.kind === 'equip' ? '<span class="tag equip">equipo</span>' : ''}${metaOf(g.item) ? `<div class="meta">${esc(metaText(g.item))}</div>` : ''}</td>
          <td class="num small">${levelText(g.item)}</td><td class="num">${g.sales}</td><td class="num">${g.units}</td>
          <td class="num">${fmt.format(g.mesos)}</td><td class="num small">${(g.mesos / total * 100).toFixed(1)}%</td><td class="num">${fmt.format(Math.round(g.med))}</td></tr>`).join('') + '</tbody>';
    } else if (tab === 'deals') {
      const base = baselines(dedupeSold([...offers.values()])), day = Date.now() - 86400000;
      const seenKey = new Map();
      const unique = [...rows].sort((a, b) => stamp(b) - stamp(a)).filter((o) => {  // la misma oferta vista en varias visitas es una sola
        const k = `${o.seller}|${o.item}|${o.price}|${o.quantity}`;
        if (seenKey.has(k)) return false;
        seenKey.set(k, o); return true;
      });
      const deals = unique.filter((o) => o.unit_price != null && !isSold(o) && (!o.state || o.state === 'active') && stamp(o) >= day && base.has(baseItem(o.item)))
        .map((o) => ({o, med: base.get(baseItem(o.item)).med, n: base.get(baseItem(o.item)).n}))
        .map((d) => ({...d, off: 1 - Number(d.o.unit_price) / d.med})).filter((d) => d.off >= 0.2);
      if (!deals.length) { table.innerHTML = '<tr><td class="empty">No hay ofertas 20% o más bajo la mediana de la última semana (en equipo, bajo sus ventas reales, con 8 o más ventas) con estos filtros.</td></tr>'; return; }
      sortBy(deals, 'deals', {off: (d) => d.off, item: (d) => baseItem(d.o.item).toLowerCase(), level: (d) => level(d.o.item),
        unit: (d) => Number(d.o.unit_price), med: (d) => d.med, seen: (d) => d.o.uploaded_at || ''});
      table.innerHTML = `<thead><tr>${th('deals', 'seen', 'Visto')}${th('deals', 'item', 'Ítem')}${th('deals', 'level', 'Nivel')}${th('deals', 'unit', 'Por unidad')}${th('deals', 'med', 'Mediana 7 días')}${th('deals', 'off', 'Descuento')}<th>Jugador</th><th>Lugar</th><th>Estadísticas</th></tr></thead><tbody>` +
        deals.slice(0, 300).map(({o, med, n, off}) => `<tr>
          <td class="small">${esc(when(o.seen_at || o.uploaded_at))}</td>
          <td><a class="item-link" data-item="${esc(baseItem(o.item))}">${esc(o.item)}</a> ${o.item_kind === 'equip' ? '<span class="tag equip">equipo</span>' : ''}</td>
          <td class="num small">${levelText(o.item)}</td>
          <td class="num">${fmt.format(o.unit_price)}</td><td class="num" title="${n} precios de referencia">${fmt.format(Math.round(med))}</td>
          <td class="num"><b style="color:var(--good)">−${(off * 100).toFixed(0)}%</b></td>
          <td>${esc(o.seller)}</td><td class="small">${esc(o.world)} · ${esc(place(o))}</td>
          <td class="small">${esc(stats(o) || (o.item_kind === 'plain' ? '—' : o.stats_complete ? '' : 'pendientes'))}</td></tr>`).join('') + '</tbody>';
    } else {
      const groups = new Map();
      for (const o of rows) {
        if (o.unit_price == null || o.state && o.state !== 'active' && !isSold(o)) continue;
        const k = `${o.world}|${baseItem(o.item)}`;
        if (!groups.has(k)) groups.set(k, {world: o.world, item: baseItem(o.item), kind: o.item_kind, prices: [], sold: [], sellers: new Set(), cheapest: null, last: o.seen_at});
        const g = groups.get(k);
        if ((o.seen_at || '') > (g.last || '')) g.last = o.seen_at;
        if (isSold(o)) { g.sold.push(Number(o.unit_price)); continue; }
        g.prices.push(Number(o.unit_price)); g.sellers.add(o.seller);
        if (!g.cheapest || Number(o.unit_price) < Number(g.cheapest.unit_price)) g.cheapest = o;
      }
      const list = [...groups.values()], change = dayChange(dedupeSold([...offers.values()]));
      for (const g of list) {
        g.change = change.has(g.item) ? change.get(g.item) : null;
        if (g.kind === 'plain') {
          for (const field of ['prices', 'sold']) {
            if (g[field].length < 6) continue;
            const med = median(g[field]);
            g[field] = g[field].filter((v) => v <= med * 20 && v >= med / 20);
          }
        }
        g.min = g.prices.length ? Math.min(...g.prices) : -1; g.avg = g.prices.length ? Math.round(mean(g.prices)) : -1;
        g.med = g.prices.length ? median(g.prices) : -1; g.soldAvg = g.sold.length ? Math.round(mean(g.sold)) : -1;
      }
      sortBy(list, 'prices', {item: (g) => g.item.toLowerCase(), level: (g) => level(g.item), offers: (g) => g.prices.length, sellers: (g) => g.sellers.size,
        change: (g) => g.change ?? -999, min: (g) => g.min, avg: (g) => g.avg, med: (g) => g.med, sold: (g) => g.sold.length, soldAvg: (g) => g.soldAvg, last: (g) => g.last || ''});
      const num = (v, x) => v.length ? fmt.format(x) : '—';
      table.innerHTML = `<thead><tr>${th('prices', 'item', 'Ítem')}${th('prices', 'level', 'Nivel')}<th>Mundo</th>${th('prices', 'offers', 'Ofertas')}${th('prices', 'sellers', 'Jugadores')}${th('prices', 'change', 'Cambio 24 h')}${th('prices', 'min', 'Mínimo / u.')}${th('prices', 'avg', 'Promedio / u.')}${th('prices', 'med', 'Mediana / u.')}${th('prices', 'sold', 'Vendidos')}${th('prices', 'soldAvg', 'Venta promedio / u.')}<th>Más barato en</th>${th('prices', 'last', 'Último')}</tr></thead><tbody>` +
        list.map((g) => `<tr><td><a class="item-link" data-item="${esc(g.item)}">${esc(g.item)}</a> ${g.kind === 'equip' ? '<span class="tag equip">equipo</span>' : ''}${metaOf(g.item) ? `<div class="meta">${esc(metaText(g.item))}</div>` : ''}</td>
          <td class="num small">${levelText(g.item)}</td>
          <td class="small">${esc(g.world)}</td><td class="num">${g.prices.length}</td><td class="num">${g.sellers.size}</td>
          <td class="num">${pct(g.change)}</td><td class="num">${num(g.prices, g.min)}</td><td class="num">${num(g.prices, g.avg)}</td><td class="num">${num(g.prices, Math.round(g.med))}</td>
          <td class="num">${g.sold.length}</td><td class="num">${num(g.sold, g.soldAvg)}</td>
          <td class="small">${g.cheapest ? `${esc(g.cheapest.seller)} · ${esc(place(g.cheapest))}` : '—'}</td><td class="small">${esc(when(g.last))}</td></tr>`).join('') + '</tbody>';
    }
  }

  function start() {
    $('setup').hidden = true; $('live').hidden = false;
    offers.clear(); newest = null; clearTimeout(timer); poll();
  }

  $('live').addEventListener('click', (event) => {
    const link = event.target.closest('.item-link');
    if (link) { selected = link.dataset.item; history = null; render(); loadHistory(selected); window.scrollTo(0, 0); }
  });
  $('table').addEventListener('click', (event) => {
    const head = event.target.closest('th.sortable');
    if (!head) return;
    const s = sorts[head.dataset.tab];
    s.dir = s.key === head.dataset.sort ? -s.dir : (['item', 'seller'].includes(head.dataset.sort) ? 1 : -1); s.key = head.dataset.sort;
    render();
  });
  for (const id of ['q', 'world', 'channel', 'kind', 'recent', 'cat', 'job', 'lmin', 'lmax']) $(id).addEventListener('input', render);
  $('group').addEventListener('input', () => { fillCats(); render(); });
  $('lvlpre').addEventListener('input', () => {
    const [lo, hi] = $('lvlpre').value ? $('lvlpre').value.split('-') : ['', ''];
    $('lmin').value = lo; $('lmax').value = hi; render();
  });
  fetch('catalog.json').then((r) => r.json()).then((data) => {
    catalog = new Map(Object.entries(data).map(([name, v]) => [name.toLowerCase(), {cat: v[0], level: v[1], jobs: v[2]}]));
    fillCats(); render();
  }).catch(() => {});
  document.querySelectorAll('.tabs button').forEach((button) => button.addEventListener('click', () => {
    tab = button.dataset.tab;
    document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b === button)));
    render();
  }));
  $('setup-save').addEventListener('click', () => {
    base = $('setup-url').value.trim().replace(/\/+$/, ''); key = $('setup-key').value.trim();
    try { localStorage.setItem('msce-live', JSON.stringify({url: base, key})); } catch (e) {}
    start();
  });
  setInterval(() => { if (lastOk) setStatus(`En vivo · ${fmt.format(offers.size)} ofertas · última subida ${ago(newest) || '—'}`); }, 15000);
  if (base && key) start();
  else { $('setup').hidden = false; setStatus('Falta configurar la base', true); }
})();
</script>
</body>
</html>
